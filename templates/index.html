<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso Correto do G & LJ</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
        }

        header {
            background: #111827;
            color: white;
            padding: 45px 20px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        p {
            font-size: 18px;
        }

        .container {
            padding: 30px 20px;
        }

        .curso {
            background: white;
            margin: 15px auto;
            padding: 20px;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .curso h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Curso Correto do G & LJ</h1>
        <p>Aprenda, desenvolva e prepare-se para o seu futuro.</p>
    </header>

    <div class="container">
        <div class="curso">
            <h2>Cursos Técnicos</h2>
            <p>Encontre conteúdos para diferentes áreas técnicas.</p>
        </div>

        <div class="curso">
            <h2>Aprendizagem</h2>
            <p>Estude de forma simples, organizada e acessível.</p>
        </div>

        <div class="curso">
            <h2>Em breve</h2>
            <p>Novos cursos e conteúdos serão adicionados.</p>
        </div>
    </div>

</body>
</html>
